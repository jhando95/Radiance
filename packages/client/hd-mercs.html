<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiance — HD mercenaries</title>
    <style>
      body {
        margin: 0;
        padding: 0 0 48px;
        background: #0d0b14;
        color: #c9bfae;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      #game {
        width: 1920px;
        height: 1080px;
        max-width: 100vw;
        max-height: 56.25vw;
      }
      #rest {
        padding: 8px 24px;
      }
      h2 {
        color: #f2a93b;
        font-size: 14px;
        margin: 24px 0 8px;
        border-bottom: 1px solid #231f3d;
        padding-bottom: 4px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: flex-end;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .cell canvas {
        background: #17142a;
      }
      .cell span {
        color: #9c9183;
        font-size: 10px;
      }
      pre {
        color: #8399ba;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rest"></div>
    <script type="module" src="/src/art/hd/gallery-mercs.ts"></script>
  </body>
</html>
